<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF RAG</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f6e6e'/%3E%3Cpath d='M9 7h10l5 5v13H9z' fill='white'/%3E%3Cpath d='M12 17h9M12 21h6' stroke='%230f6e6e' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span>PDF RAG</span>
    </div>
    <div class="model-picker">
      <label for="model-select">Model</label>
      <select id="model-select">
        <option>Loading models…</option>
      </select>
      <span id="model-note" class="model-note"></span>
    </div>
  </header>

  <div id="banner" class="banner" role="alert" hidden></div>

  <div class="layout">
    <aside class="sidebar">
      <section class="side-section" aria-labelledby="chats-heading">
        <div class="panel-head">
          <h2 id="chats-heading">Chats</h2>
          <button id="new-chat" type="button" class="primary small">New chat</button>
        </div>
        <ul id="chat-list" class="chat-list" aria-label="Saved chats"></ul>
        <p id="chats-empty" class="empty" hidden>No chats yet.</p>
      </section>

      <section class="side-section" aria-labelledby="documents-heading">
        <div class="panel-head">
          <h2 id="documents-heading">Documents</h2>
          <span id="documents-count" class="count"></span>
        </div>

        <details id="upload-box" class="upload-box" open>
          <summary>Upload PDFs</summary>
          <fieldset id="extractor-choice" class="extractors">
            <legend>Read charts and scanned pages with</legend>
          </fieldset>
          <div id="dropzone" class="dropzone" tabindex="0" role="button" aria-describedby="dropzone-hint">
            <span class="dropzone-icon" aria-hidden="true"></span>
            <span><strong>Drop PDFs here</strong> or <span class="link">choose files</span></span>
            <span id="dropzone-hint" class="hint">PDF only</span>
            <input id="file-input" type="file" accept="application/pdf,.pdf" multiple hidden>
          </div>
        </details>

        <ul id="uploads" class="uploads" aria-label="Uploads in progress"></ul>
        <ul id="document-list" class="doc-list" aria-label="Your documents"></ul>
        <p id="documents-empty" class="empty" hidden>No documents yet. Upload a PDF to get started.</p>
      </section>
    </aside>

    <main class="main" id="main">
      <div class="chat-head">
        <h1 id="chat-title" class="chat-title">New chat</h1>
        <details id="doc-filter" class="doc-filter">
          <summary>All documents</summary>
          <div class="doc-filter-body"></div>
        </details>
      </div>
      <div id="messages" class="messages" role="log" aria-live="polite" aria-label="Conversation"></div>
      <form id="composer" class="composer">
        <label for="question" class="visually-hidden">Your question</label>
        <textarea id="question" rows="1" placeholder="Ask about your documents…"></textarea>
        <button id="send" type="submit" class="primary">Send</button>
        <button id="stop" type="button" class="danger" hidden>Stop</button>
      </form>
      <p class="composer-hint">Enter to send · Shift+Enter for a new line</p>
    </main>
  </div>

  <aside id="source-panel" class="source-panel" aria-labelledby="source-title" hidden></aside>
  <dialog id="details" class="details" aria-labelledby="details-title"></dialog>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
</body>
</html>
