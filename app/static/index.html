<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF RAG</title>
  <style>
    :root { color-scheme: light dark; --bg: #f7f7f8; --fg: #1d1d1f; --muted: #6b6b70; --ok: #1a7f37; --bad: #c62828; }
    @media (prefers-color-scheme: dark) { :root { --bg: #18181b; --fg: #ececf1; --muted: #a1a1aa; --ok: #4ade80; --bad: #f87171; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
           font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { text-align: center; padding: 16px; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { margin: 4px 0; color: var(--muted); }
    #status.ok { color: var(--ok); }
    #status.bad { color: var(--bad); }
  </style>
</head>
<body>
  <main>
    <h1>PDF RAG</h1>
    <p>Chat with your PDFs. The full interface arrives in a later phase.</p>
    <p id="status">Checking server…</p>
  </main>
  <script>
    const el = document.getElementById("status");
    fetch("/api/health")
      .then((r) => r.json())
      .then((d) => { el.textContent = `Server is running (v${d.version})`; el.className = "ok"; })
      .catch(() => { el.textContent = "Server is not reachable"; el.className = "bad"; });
  </script>
</body>
</html>
