name: pdf-rag

services:
  app:
    build:
      context: .
      target: runtime
    image: pdf-rag:latest
    # Host networking lets the container reach Ollama on 127.0.0.1:11434
    # without changing Ollama's settings. The app listens on APP_HOST:APP_PORT.
    network_mode: host
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
    # Start again after a crash or a reboot (Docker itself starts at boot),
    # unless you stopped it with `docker compose stop` or `down`.
    restart: unless-stopped
    healthcheck:
      # The server answers /api/health while it runs, even if a part is degraded.
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ.get('APP_PORT', '8000') + '/api/health', timeout=5)"
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  test:
    build:
      context: .
      target: test
    image: pdf-rag:test
    profiles: ["test"]
